[workspace]
members = ["crates/crewroom-core", "crates/crewroom-service", "crates/crewroom-desktop", "crates/crewroom-runtime", "crates/crewroom-test-support"]
exclude = ["vendor/gpui-libghostty", "vendor/gpui-component", "vendor/gpui-pre"]
default-members = ["crates/crewroom-core", "crates/crewroom-service", "crates/crewroom-test-support"]
resolver = "3"

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
futures-util = "0.3"
libc = "0.2"
url = "2"
gpui-kit = "=0.7.0"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = "debuginfo"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
gpui-pre = { path = "vendor/gpui-pre" }
