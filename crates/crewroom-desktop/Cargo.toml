[package]
name = "crewroom-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "crewroom"
path = "src/main.rs"

[dependencies]
crewroom-core = { path = "../crewroom-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest.workspace = true
gpui-kit.workspace = true
gpui-libghostty = { version = "=0.3.1", path = "../../vendor/gpui-libghostty" }
futures-util.workspace = true
tokio.workspace = true
async-channel = "2"
tungstenite = "0.29"
url.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "=0.26.3"
gpui-pre-apple = { version = "=0.3.7", features = ["runtime_shaders"] }

[dev-dependencies]
crewroom-test-support = { path = "../crewroom-test-support" }
rusqlite.workspace = true
crewroom-runtime = { path = "../crewroom-runtime" }
crewroom-service = { path = "../crewroom-service" }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
