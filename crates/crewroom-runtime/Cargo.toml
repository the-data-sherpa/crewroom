[package]
name = "crewroom-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "crewroom-process"
path = "src/main.rs"

[[bin]]
name = "crewroom-host"
path = "src/host_main.rs"

[dependencies]
crewroom-core = { path = "../crewroom-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
libc.workspace = true
tokio.workspace = true
base64 = "0.22"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.2"
zeroize = "1"
encoding_rs = "0.8"
axum.workspace = true
futures-util.workspace = true
url.workspace = true
reqwest = { workspace = true, features = ["stream"] }
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "=0.4.49", features = ["tokio", "gzip", "zlib", "deflate", "brotli", "zstd"] }

[dev-dependencies]
tempfile.workspace = true
