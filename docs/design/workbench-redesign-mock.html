<title>Crewroom Session Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one native-feeling window. Sessions rail | session (coordinator over specialist grid) | evidence drawer. */
:root{
  color-scheme:dark;
  --ground:#0a1016; --bg:#111a22; --side:#0e171e; --panel:#15212b; --panel2:#1a2833; --term:#0a1117;
  --line:#293642; --line2:#34495a; --fg:#e2e8ed; --muted:#93a4b1; --faint:#66788a;
  --sel:#223b46; --accent:#84d7bc; --accent-ink:#0d2a22; --btn:#1f6b52; --btn-h:#25805f;
  --blue:#7faec5; --amber:#f1bf73; --amber-bg:#3a2f1c; --red:#ffb0a2; --red-bg:#462c2e; --ok-bg:#183a30;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--fg);font:13px/1.45 var(--ui);padding-block:14px;padding-inline:16px;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.window{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--bg);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.titlebar{height:34px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding-inline:12px;background:var(--side);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.lights{display:flex;gap:7px}.lights i{width:11px;height:11px;border-radius:50%;background:#ec6a5e}.lights i:nth-child(2){background:#f4bf4f}.lights i:nth-child(3){background:#61c554}
.titlebar .ttl{flex:1;text-align:center}
.mockflag{font-size:11px;border:1px solid var(--line2);border-radius:20px;padding:1px 8px;color:var(--amber)}
#app{flex:1;min-height:0;display:grid;grid-template-columns:268px minmax(0,1fr);position:relative}

/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;font-weight:700;font-size:16px}
.brand .conn{margin-left:auto;font-size:11px;font-weight:500;color:var(--accent);display:flex;align-items:center;gap:5px}
.brand .conn i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.navbtn{margin:0 10px 6px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);text-align:left}
.navbtn:hover{border-color:var(--line2)} .navbtn.on{background:var(--sel);border-color:var(--blue)}
.badge{margin-left:auto;min-width:20px;text-align:center;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px;background:var(--amber);color:#2a1d05}
.badge.zero{background:var(--line);color:var(--muted)}
.side-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:4px}
.grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 4px 4px;display:flex;justify-content:space-between}
.grp span{letter-spacing:0;text-transform:none}
.trow{display:flex;flex-direction:column;gap:3px;padding:8px 9px;border-radius:8px;border:1px solid transparent;background:transparent;text-align:left;width:100%}
.trow:hover{background:var(--panel)} .trow.on{background:var(--sel);border-color:#3c6273}
.tkey{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tkey .pos{margin-left:auto;color:var(--blue)}
.ttitle{font-weight:600;font-size:12.5px;line-height:1.3}
.facts{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.fact{font-size:10.5px;border-radius:4px;padding:1px 5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.fact b{font-weight:600;color:var(--fg)}
.fact.live{border-color:#2d5a4b;color:var(--accent)} .fact.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:4px;animation:pulse 1.6s infinite}
.fact.warn{border-color:#5a4826;color:var(--amber)}
@keyframes pulse{50%{opacity:.35}}
.side-foot{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}
.side-foot button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.side-foot button:hover{border-color:var(--line2)} .side-foot .on{background:var(--sel);border-color:var(--blue)}
.side-foot svg{width:15px;height:15px}

/* Main */
.main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.mobilebar{display:none}
.scroll{flex:1;min-height:0;overflow-y:auto}
.statusbar{flex-shrink:0;border-top:1px solid var(--line);padding:6px 16px;display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.statusbar span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;background:var(--accent)}
.statusbar span.off::before{background:var(--amber)}
.statusbar .right{margin-left:auto}.statusbar .right::before{display:none}

.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);font-weight:500;white-space:nowrap}
.btn:hover{border-color:#4a6378} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--btn);border-color:#2b8a68;color:#fff} .btn.primary:hover{background:var(--btn-h)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--red);border-color:#6b3a36;background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.icon{width:28px;height:28px;padding:0;justify-content:center}
.icon svg{width:14px;height:14px}
.hint{color:var(--muted);font-size:12px}
.chip{font-size:11px;border-radius:5px;padding:1px 6px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;font-family:var(--mono)}
.pill{font-size:11px;font-weight:600;border-radius:20px;padding:2px 8px;white-space:nowrap;border:1px solid var(--line2)}
.pill.green{color:var(--accent);background:var(--ok-bg);border-color:#2d5a4b}
.pill.amber{color:var(--amber);background:var(--amber-bg);border-color:#5a4826}
.pill.red{color:var(--red);background:var(--red-bg);border-color:#6b3a36}
.pill.blue{color:var(--blue);border-color:#3c6273}
.pill.muted{color:var(--muted)}
.pill.dashed{border-style:dashed;color:var(--amber)}

/* Session header */
.session{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.sh-top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sh-top .who{flex:1;min-width:0}
.keyline{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex{font-family:var(--ui);font-size:10.5px;color:var(--amber);border:1px dashed #5a4826;border-radius:4px;padding:0 5px}
h1{font-size:20px;margin:2px 0 0;line-height:1.25;text-wrap:balance}
.sh-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:6px;align-items:center;padding:4px 6px 4px 10px;border:1px solid #6b3a36;border-radius:8px;background:var(--red-bg);font-size:12px}
.factsbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.factsbar>div{padding:8px 12px;min-width:0;border-left:1px solid var(--line)} .factsbar>div:first-child{border-left:0}
.factsbar label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.factsbar strong{display:block;font-size:13px;margin-top:1px}
.factsbar small{display:block;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.factsbar .notready strong{color:var(--amber)} .factsbar .ready strong{color:var(--accent)}

.pbar{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.pb-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pb-top label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
select{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:4px 8px}
.steps{display:flex;gap:4px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.step{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 8px 3px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.step i{font-style:normal;width:14px;text-align:center}
.step.done{color:var(--fg)} .step.done i{color:var(--accent)}
.step.active{border-color:#3c6273;color:var(--fg);background:#16303b} .step.active i{color:var(--blue);animation:pulse 1.6s infinite}
.step.skipped{border-style:dashed;color:var(--faint)} .step.skipped span{text-decoration:line-through}
.skipnote{font-size:11.5px;color:var(--muted)} .skipnote b{color:var(--fg);font-weight:600}
.timebar{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{width:110px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--blue)}

/* Panes */
.pane{border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.phead{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:42px}
.phead .nm{font-weight:700}
.phead .meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;flex:1;min-width:0}
.phead .ctl{display:flex;gap:4px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 8px;font-size:11.5px;color:var(--muted)}
.seg button.on{background:var(--sel);color:var(--fg)}
.ago{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.term{background:var(--term);font:12px/1.5 var(--mono);color:#c9d4dc;padding:8px 10px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.term .p{color:var(--blue)} .term .ok{color:var(--accent)} .term .bad{color:var(--red)} .term .ml{color:#c8a7f0} .term .dim{color:#6f8090}
.pfoot{display:flex;gap:10px;align-items:center;padding:5px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);font-family:var(--mono);flex-wrap:wrap}
.pfoot .sp{flex:1}
.banner{margin:8px;padding:8px 10px;border-radius:8px;background:var(--amber-bg);border:1px solid #5a4826;color:var(--amber);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner .btn{color:var(--fg)}

.coord-body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);min-height:0}
.coord .term{height:250px;border-right:1px solid var(--line)}
.steer{display:flex;flex-direction:column;min-height:0;height:250px}
.steer-log{flex:1;min-height:0;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.smsg{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel2)}
.smsg p{margin:0 0 5px;overflow-wrap:anywhere}
.track{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:10.5px;color:var(--faint)}
.track span{padding:0 5px;border-radius:4px;border:1px solid var(--line)}
.track span.on{color:var(--accent);border-color:#2d5a4b}
.track span.wait{color:var(--amber);border-color:#5a4826;border-style:dashed}
.composer{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}
textarea,input[type=text],input[type=search]{width:100%;background:var(--term);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;resize:vertical}
textarea{min-height:54px}
.crow{display:flex;gap:8px;align-items:center}.crow .hint{flex:1;font-size:11px}

.gridlabel{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.gridlabel h2{font-size:13px;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid .term{height:230px}
.tl{height:230px;overflow:auto;background:var(--term);padding:4px 0;font-size:12px}
.tl div{display:grid;grid-template-columns:52px 70px minmax(0,1fr) auto;gap:8px;padding:3px 10px;border-bottom:1px solid #15202a;align-items:baseline}
.tl time{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.tl .k{font-size:10.5px;color:var(--blue)} .tl .k.message{color:#c8a7f0} .tl .k.result{color:var(--accent)} .tl .k.edit{color:var(--amber)}
.tl .x{overflow-wrap:anywhere} .tl .u{font-family:var(--mono);font-size:10px;color:var(--faint)}
.slot{border:1.5px dashed var(--line2);border-radius:10px;min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center;background:transparent;color:var(--muted)}
.slot:hover{border-color:var(--blue);color:var(--fg)}
.slot .plus{width:38px;height:38px;border-radius:50%;border:1.5px dashed currentColor;display:grid;place-items:center;font-size:22px}
.proposed{border-style:dashed;border-color:#5a4826}
.proposed .pbody{flex:1;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
.proposed .pbody strong{color:var(--fg)}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:32px;z-index:5;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:4px;min-width:180px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 9px;border-radius:5px}
.menu-pop button:hover{background:var(--sel)}

.checks{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);font-size:12px}
.check code{font-family:var(--mono);font-size:11px;color:var(--muted)}

.empty{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:10px}
.empty h2{margin:0;font-size:15px}
.planned{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.planned div{border:1.5px dashed var(--line2);border-radius:8px;padding:10px;font-size:12px;color:var(--muted)}
.planned b{display:block;color:var(--fg)}

/* Drawer */
.work{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0;flex:1;position:relative}
.work.withdrawer{grid-template-columns:minmax(0,1fr) 370px}
.drawer{border-left:1px solid var(--line);background:var(--side);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:7px 10px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .x{margin-left:auto}
.dbody{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.dsec h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.dsec p{margin:0 0 6px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:11px}
td code,.mono{font-family:var(--mono);font-size:11px}
.reasons{margin:0;padding-left:18px;color:var(--amber)}
.callout{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);font-size:12px;color:var(--muted)}

/* Inbox */
.page{padding:18px 20px 24px;display:flex;flex-direction:column;gap:14px;max-width:980px}
.page h1{font-size:20px}
.ibox{border:1px solid var(--line);border-radius:10px;background:var(--panel);display:grid;grid-template-columns:4px minmax(0,1fr);overflow:hidden}
.ibox .stripe{background:var(--amber)} .ibox.k-learning .stripe{background:#c8a7f0} .ibox.k-requirements .stripe{background:var(--blue)} .ibox.k-feedback .stripe{background:var(--accent)}
.ibox.done{opacity:.6} .ibox.done .stripe{background:var(--line2)}
.ibody{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ihead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ihead .kind{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.ihead h3{margin:0;font-size:14px;flex-basis:100%}
.iact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.diff{font:12px/1.5 var(--mono);background:var(--term);border:1px solid var(--line);border-radius:7px;padding:6px 0;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.diff div{padding:0 10px}
.diff .add{background:#14342a;color:#a8e8cf} .diff .del{background:#3a2022;color:#ffc4b8;text-decoration:line-through}
.filters{display:flex;gap:6px;flex-wrap:wrap}

/* Settings */
.settings{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0;flex:1}
.snav{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.snav button{text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:7px;color:var(--muted)}
.snav button.on{background:var(--sel);color:var(--fg)}
.snav .h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 10px 8px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input{max-width:260px}
.cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:6px 0 -4px;display:flex;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rcard:hover{border-color:var(--line2)}
.rcard.off{opacity:.62}
.rcard .top{display:flex;gap:8px;align-items:flex-start}
.rcard h3{margin:0;font-size:14px;flex:1}
.rcard .when{font-size:12px;color:var(--muted);flex:1}
.rcard .chips{display:flex;gap:4px;flex-wrap:wrap}
.rcard .bottom{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap}
.rcard .bottom .sp{flex:1}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:transparent;border:0;padding:0}
.toggle i{width:28px;height:16px;border-radius:9px;background:var(--line2);position:relative;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#cfd8df;transition:left .15s}
.toggle.on i{background:var(--btn)} .toggle.on i::after{left:14px}
.lock{font-size:11.5px;color:var(--faint)}
.pending{font-size:11px;color:#c8a7f0;border:1px solid #4f3d6b;border-radius:4px;padding:0 5px}

.sheet-bg{position:absolute;inset:0;background:rgba(5,9,13,.55);z-index:20;display:flex;justify-content:flex-end}
.sheet{width:min(620px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line2);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.sheet-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet-head h2{margin:0;font-size:16px;flex:1}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:18px}
.sheet-foot{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet-foot .hint{flex:1}
.fsec{display:flex;flex-direction:column;gap:8px}
.fsec>h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0;display:flex;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:600;font-size:12px;display:flex;gap:6px;align-items:center}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.drafted{font-size:10px;font-weight:600;color:#c8a7f0;border:1px solid #4f3d6b;border-radius:4px;padding:0 4px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:7px;padding:5px 9px;background:transparent;font-size:12px;color:var(--muted);text-align:left}
.pchip.on{border-color:#2d5a4b;background:var(--ok-bg);color:var(--fg)}
.pchip.on::before{content:"✓";color:var(--accent)}
.resolve{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);font-size:12px}
.resolve b{font-family:var(--mono);font-weight:600}
.toolslist{display:flex;flex-wrap:wrap;gap:6px}
.toolslist span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}
.revs{display:flex;flex-direction:column;gap:6px}
.rev{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.rev .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.preview{font:11.5px/1.55 var(--mono);background:var(--term);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:380px;overflow:auto;color:#c9d4dc}
details summary{cursor:pointer;color:var(--blue);font-size:12px}

/* Modal */
.modal-bg{position:absolute;inset:0;background:rgba(5,9,13,.6);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{width:min(640px,100%);background:var(--bg);border:1px solid var(--line2);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column}
.modal-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal-head h2{margin:0;font-size:16px;flex:1}
.modal-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.modal-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.modal-foot .hint{flex:1}
.rolepick{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;padding:6px}
.rolepick .cat{margin:6px 4px 2px}
.ropt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;padding:7px 9px;border-radius:7px;border:1px solid transparent;background:transparent}
.ropt:hover{background:var(--panel)} .ropt.on{background:var(--sel);border-color:#3c6273}
.ropt b{font-size:13px} .ropt small{grid-column:1/-1;color:var(--muted);font-size:11.5px} .ropt .chip{align-self:center}
.checkrow{display:flex;gap:6px;flex-wrap:wrap}
.cbx{display:flex;gap:6px;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:transparent;color:var(--muted);text-align:left}
.cbx.on{border-color:#3c6273;color:var(--fg);background:var(--sel)}
.cbx::before{content:"";width:11px;height:11px;border-radius:3px;border:1px solid var(--line2);flex-shrink:0}
.cbx.on::before{background:var(--blue);border-color:var(--blue)}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--blue);animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.toasts{position:absolute;right:16px;bottom:40px;z-index:40;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:in .2s ease-out}
.toast.warn{border-left-color:var(--amber)}
@keyframes in{from{transform:translateY(6px);opacity:0}}

.maxwrap{position:absolute;inset:0;z-index:15;background:var(--bg);padding:14px;display:flex;flex-direction:column}
.maxwrap .pane{flex:1;min-height:0}
.maxwrap .term,.maxwrap .tl{flex:1;height:auto;min-height:0}

/* Responsive */
@media (max-width:1250px){.work.withdrawer{grid-template-columns:minmax(0,1fr)}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(370px,100%);z-index:12;box-shadow:-20px 0 50px rgba(0,0,0,.45)}}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.coord-body{grid-template-columns:minmax(0,1fr)}.coord .term{border-right:0;border-bottom:1px solid var(--line);height:200px}.steer{height:auto}.steer-log{max-height:180px}}
@media (max-width:820px){
  body{padding-inline:16px;padding-block:8px}
  #app{grid-template-columns:minmax(0,1fr)}
  .side{position:absolute;left:0;top:0;bottom:0;width:min(300px,88%);z-index:25;transform:translateX(-102%);transition:transform .2s;box-shadow:20px 0 50px rgba(0,0,0,.45)}
  .side.open{transform:none}
  .mobilebar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .grid{grid-template-columns:minmax(0,1fr)}
  .factsbar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .factsbar>div:nth-child(3){border-left:0}
  .factsbar>div:nth-child(n+3){border-top:1px solid var(--line)}
  .settings{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .snav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .snav .h{display:none}
  .row2{grid-template-columns:minmax(0,1fr)}
  .timebar{margin-left:0}
  .titlebar .ttl{display:none}
}

  inbox:[

    {id:"i2",kind:"learning",ticket:"t1",role:"reviewer",title:"Coordinator proposes a change to Independent reviewer",reason:"The last two reviews approved candidates without running the rebalance scenario at the reviewed revision.",add:"Before approving, run the scenario tests named in the brief at the candidate revision and quote the result.",from:"Coordinator · PILOT-REDACTED",status:"open"},
    {id:"i3",kind:"requirements",ticket:"t2",title:"Jira description changed for PILOT-REDACTED",detail:"The new Jira text adds: “Errors must name the failing function.” The accepted brief is revision 2. The queued plan keeps revision 2 until you adopt a new one.",status:"open"},
    {id:"i4",kind:"feedback",ticket:"t3",title:"2 new review comments on PR #208",detail:"“Link the upgrade-order section from the release notes.” · “The warning copy says ‘leader node’; the UI calls it ‘Leader’.” Resume addresses them on the same branch and PR, with fresh checks and review.",status:"open"},
  ],
  modal:null, editor:null, menu:null, maxAgent:null, toasts:[], drafts:{steer:""}, roleSearch:"", roleFilter:"all", inboxFilter:"open",
};
const role = id => S.roles.find(r=>r.id===id);
const ticket = id => S.tickets.find(t=>t.id===id);
const openInbox = () => S.inbox.filter(i=>i.status==="open");
function resolve(r){
  const job = r.job || "judgment";
  return {job, model:r.model || S.jobs[job], effort:r.effort || BUDGETS[S.budget].effort[job], overridden:!!(r.model||r.effort)};
}
const short = m => m.replace("claude-","").replace(/-(\d)-(\d)$/," $1.$2");

/* ---------- views ---------- */
const wfLabel = () => ({running:"Coordinating",pausing:"Pausing…",paused:"Paused",resuming:"Resume requested",cancelled:"Cancelled"})[S.run.status];
function sidebar(){
  const row = t => {
    const live = t.id==="t1" && S.run.status!=="cancelled";
    const n = [S.run.coord,...S.run.agents].filter(a=>a.state==="executing").length;
    let activity = "No agents";
    if (live) activity = S.run.status==="paused" ? "Agents stopped" : S.run.status==="pausing" ? "Stopping agents" : n+" executing";
    const wf = t.id==="t1" ? wfLabel() : t.workflow;
    const facts = `<span class="fact" title="Jira status">Jira <b>${esc(t.jira)}</b></span><span class="fact ${wf.startsWith("Queued")||wf.startsWith("Paused")?"warn":""}" title="Workflow state">${esc(wf)}</span><span class="fact ${live&&S.run.status==="running"?"live":""}" title="Agent activity">${activity}</span>`;
    return `<button class="trow ${S.view==="session"&&S.selected===t.id?"on":""}" data-a="ticket" data-id="${t.id}">
      <span class="tkey">${esc(t.key)} · ${esc(t.source)}${t.queue?`<span class="pos">#${t.queue} in queue</span>`:""}</span>
      <span class="ttitle">${esc(t.title)}</span><span class="facts">${facts}</span></button>`;
  };
  const live = S.tickets.filter(t=>t.live && S.run.status!=="cancelled");
  const queued = S.tickets.filter(t=>t.queue).sort((a,b)=>a.queue-b.queue);
  const other = S.tickets.filter(t=>!t.queue && !(t.live && S.run.status!=="cancelled"));
  const n = openInbox().length;
  return `<aside class="side ${S.navOpen?"open":""}" aria-label="Sessions">
    <div class="brand">Crewroom <span class="conn"><i></i>Connected</span></div>
    <button class="navbtn ${S.view==="inbox"?"on":""}" data-a="go" data-view="inbox">${ICON.inbox} Needs you <span class="badge ${n?"":"zero"}">${n}</span></button>
    <div class="side-scroll">
      <div class="grp">Running <span>1 coding slot</span></div>${live.map(row).join("")||'<p class="hint" style="padding:0 6px">No coding run holds the slot.</p>'}
      <div class="grp">Queue <span>local order, not Jira rank</span></div>${queued.map(row).join("")}
      <div class="grp">Other tickets</div>${other.map(row).join("")}
    </div>
    <div class="side-foot"><button data-a="newTicket">${ICON.plus} New ticket</button><button class="${S.view==="settings"?"on":""}" data-a="go" data-view="settings" aria-label="Settings">${ICON.gear} Settings</button></div>
  </aside>`;
}

function steps(t, interactive){
  const pb = PLAYBOOKS.find(p=>p.id===t.playbook);
  const r = S.run; const isRun = t.id==="t1";
  const items = pb.steps.map((s,i)=>{
    let st = "todo", ic = "○";
    if (isRun){
      if (r.steps.skipped[i]) {st="skipped"; ic="⤼";}
      else if (i < r.steps.done || (i===0||i===1)) {st="done"; ic="✓";}
      else if (i===r.steps.active) {st="active"; ic="●";}
    } else if (t.id==="t3"){ st = i < pb.steps.length-1 ? "done":"active"; ic = st==="done"?"✓":"●"; }
    return `<li class="step ${st}" title="${esc(st==="skipped"?"Skipped: "+r.steps.skipped[i]:st)}"><i>${ic}</i><span>${esc(s)}</span></li>`;
  }).join("");
  const skipped = isRun ? Object.entries(r.steps.skipped).map(([i,why])=>`<div class="skipnote">Skipped <b>${esc(pb.steps[i])}</b>: ${esc(why)}</div>`).join("") : "";
  const doneN = isRun ? pb.steps.filter((_,i)=>!r.steps.skipped[i] && i<r.steps.active).length : t.id==="t3"?pb.steps.length-1:0;
  const time = isRun ? `<span class="timebar">Active ${Math.floor(r.activeS/60)}m ${String(r.activeS%60).padStart(2,"0")}s of 60m <span class="meter"><i style="width:${Math.min(100,r.activeS/r.limitS*100)}%"></i></span></span>` : "";
  return `<div class="pbar">
    <div class="pb-top"><label for="pb-sel">Playbook</label>
      <select id="pb-sel" data-change="playbook" ${interactive?"":""}>${PLAYBOOKS.map(p=>`<option value="${p.id}" ${p.id===t.playbook?"selected":""}>${p.name}</option>`).join("")}</select>
      <span class="hint">${t.playbookBy==="coordinator"?"Proposed by the coordinator":"Chosen by you"} · ${doneN} of ${pb.steps.length} steps done · steps are a plan, not evidence</span>${time}</div>
    <ol class="steps">${items}</ol>${skipped}</div>`;
}

function facts(t){
  const r = S.run; const isRun = t.id==="t1";
  let activity = "No agent processes", actSub = "A queued plan is not an executing agent";
  if (isRun){
    const ex = r.agents.filter(a=>a.state==="executing").length + (r.coord.state==="executing"?1:0);
    const bl = r.agents.filter(a=>a.state==="blocked").length;
    const pr = r.agents.filter(a=>a.state==="proposed").length;
    if (r.status==="cancelled"){activity="Ended";actSub="All processes stopped";}
    else if (r.status==="paused"){activity="Stopped";actSub="Ownership confirmed stopped";}
    else if (r.status==="pausing"){activity="Stopping…";actSub="Waiting for agents to reach a safe point";}
    else {activity=`${ex} executing`; actSub=[bl?bl+" blocked":"", pr?pr+" proposed":"", "all observed"].filter(Boolean).join(" · ");}
  }
  if (t.id==="t3"){activity="No agent processes"; actSub="Paused at the review gate";}
  const ready = t.id==="t3"
    ? `<div class="ready"><label>Readiness</label><strong>Ready for your review</strong><small>Checks and review pass at 9b20c4e</small></div>`
    : isRun ? `<div class="notready"><label>Readiness</label><strong>Not ready</strong><small>Unit tests running · criterion 3 failing · review not started</small></div>`
    : `<div><label>Readiness</label><strong>No candidate</strong><small>Nothing to validate yet</small></div>`;
  const wf = isRun ? wfLabel() : t.workflow;
  return `<div class="factsbar">
    <div><label>Jira status</label><strong>${esc(t.jira)}</strong><small>${t.source==="Local"?"Local ticket":"Last synced 2m ago"}</small></div>
    <div><label>Workflow</label><strong>${esc(wf)}</strong><small>${isRun?"Coding run · slot holder":esc(t.hold||"—")}</small></div>
    <div><label>Agent activity</label><strong>${esc(activity)}</strong><small>${esc(actSub)}</small></div>${ready}</div>`;
}

function agentHead(a, isCoord){
  const r = role(a.roleId); const m = resolve(r);
  const st = {executing:["green","Executing"],blocked:["amber","Blocked · repair limit"],paused:["muted","Stopped"],ended:["muted","Ended"],idle:["muted","Idle"]}[a.state] || ["muted",a.state];
  const menu = S.menu===a.id ? `<div class="menu-pop" role="menu">
      <button data-a="teach" data-id="${a.id}">Teach this role…</button>
      <button data-a="openRole" data-role="${r.id}">Open ${esc(r.name)} role</button>
      ${isCoord?"":`<button data-a="askRetire" data-id="${a.id}">Ask coordinator to retire</button>`}</div>` : "";
  return `<div class="phead">
    <div class="meta"><span class="nm">${esc(r.name)}</span>
      <span class="chip" title="${esc(JOBS[m.job].name)} job${m.overridden?" · role override":""}">${esc(short(m.model))} · ${esc(m.effort)}</span>
      <span class="chip">Attempt ${a.attempt}</span><span class="pill ${st[0]}">${st[1]}</span>
      <span class="ago" data-ago="${a.id}">${a.state==="executing"?"active "+ago(a.last):"last output "+ago(a.last)}</span></div>
    <div class="ctl"><span class="seg" role="group" aria-label="View"><button class="${a.mode==="terminal"?"on":""}" data-a="mode" data-id="${a.id}" data-mode="terminal">Terminal</button><button class="${a.mode==="timeline"?"on":""}" data-a="mode" data-id="${a.id}" data-mode="timeline">Timeline</button></span>
      <button class="btn ghost icon" data-a="max" data-id="${a.id}" aria-label="${S.maxAgent===a.id?"Restore":"Maximize"}">${S.maxAgent===a.id?ICON.min:ICON.max}</button>
      <span class="menu"><button class="btn ghost icon" data-a="menu" data-id="${a.id}" aria-label="More">${ICON.dots}</button>${menu}</span></div></div>`;
}
function agentBody(a){
  if (a.mode==="timeline") return `<div class="tl" id="tl-${a.id}">${a.timeline.map(tlRow).join("")}</div>`;
  return `<div class="term" id="term-${a.id}" tabindex="0" aria-label="Read-only terminal">${a.lines.map(lineHtml).join("")}</div>`;
}
const tlRow = e => `<div><time>${clock(e.t)}</time><span class="k ${e.kind}">${e.kind}</span><span class="x">${esc(e.text)}</span><span class="u">${esc(e.usage||"")}</span></div>`;

function tile(a){
  if (a.state==="proposed"){
    const r = role(a.roleId);
    return `<section class="pane proposed"><div class="phead"><div class="meta"><span class="nm">${esc(r.name)}</span><span class="pill dashed">Proposed · not started</span></div></div>
      <div class="pbody"><p><strong>No process yet, so there is no terminal.</strong></p><p>${S.run.status==="running"?"Crewroom starts it at the next safe coordination point.":"Waits for Resume and a safe coordination point."}</p>
      <p>Assignment: ${esc(a.assignment||"—")}</p>${a.deps?.length?`<p>Depends on: ${esc(a.deps.join(", "))}</p>`:""}
      <div><button class="btn sm" data-a="withdraw" data-id="${a.id}">Withdraw proposal</button></div></div></section>`;
  }
  const blocked = a.state==="blocked" ? `<div class="banner">Automatic repair cycles used: 2 of 2. <button class="btn sm" data-a="go" data-view="inbox">Decide in Needs you</button></div>` : "";
  return `<section class="pane" id="pane-${a.id}">${agentHead(a,false)}${blocked}${agentBody(a)}
    <div class="pfoot"><span>omp ${a.pid}</span><span>tmux ${a.pane}</span><span class="sp"></span><span>${a.state==="executing"?"Observed":"Retained output"}</span></div></section>`;
}

function session(){
  const t = ticket(S.selected); if (!t) return `<div class="page"><h1>Choose a ticket</h1></div>`;
  const r = S.run; const isRun = t.id==="t1";
  let actions = "";
  if (isRun){
    if (r.status==="running") actions += `<button class="btn" data-a="pause">Pause run</button>`;
    else if (r.status==="paused") actions += `<button class="btn primary" data-a="resume">Resume run</button>`;
    else if (r.status==="pausing"||r.status==="resuming") actions += `<button class="btn" disabled><span class="spinner"></span>${r.status==="pausing"?"Pausing…":"Resuming…"}</button>`;
    if (r.status==="cancelled") actions += `<button class="btn primary" data-a="continueLater">Continue later</button>`;
    else if (r.confirmCancel) actions += `<span class="confirm">End this run? Changes, evidence and the branch are kept. <button class="btn sm danger" data-a="cancelYes">Cancel run</button><button class="btn sm ghost" data-a="cancelNo">Keep running</button></span>`;
    else actions += `<button class="btn danger" data-a="cancelAsk">Cancel run…</button>`;
  }
  actions += `<button class="btn ${S.drawer.open?"":"ghost"}" data-a="drawer">${S.drawer.open?"Hide details":"Brief · Results · History"}</button>`;
  const head = `<div class="sh-top"><div class="who"><div class="keyline">${esc(t.key)} <span>${esc(t.source)} ticket</span><span class="ex">Example data</span></div><h1>${esc(t.title)}</h1></div><div class="sh-actions">${actions}</div></div>`;

  let body = "";
  if (isRun && r.status!=="cancelled"){
    const c = r.coord;
    const msgs = r.steering.map(m=>{
      const st = (k,label)=> m[k] ? `<span class="on" title="${clock(m[k])}">${label} ${clock(m[k]).slice(0,5)}</span>` : `<span class="wait">${label}</span>`;
      const note = !m.received && (r.status!=="running") ? `<span>Delivers on Resume</span>` : "";
      return `<div class="smsg"><p>${esc(m.text)}</p><div class="track">${st("stored","Stored")}→${st("received","Received")}→${st("applied","Applied")}${note}</div></div>`;
    }).join("") || `<p class="hint">No steering sent in this run.</p>`;
    const coordPane = `<section class="pane coord" id="pane-coord">${agentHead(c,true)}
      <div class="coord-body">${c.mode==="timeline"?`<div class="tl" id="tl-coord" style="height:250px">${c.timeline.map(tlRow).join("")}</div>`:`<div class="term" id="term-coord" tabindex="0" aria-label="Coordinator terminal, read-only">${c.lines.map(lineHtml).join("")}</div>`}
        <div class="steer"><div class="steer-log" id="steer-log" aria-live="polite">${msgs}</div>
          <div class="composer"><label class="hint" for="steer-input" style="font-weight:600;color:var(--fg)">Direct the coordinator</label>
            <textarea id="steer-input" data-bind="drafts.steer" rows="2" placeholder="e.g. Add a test for two rebalances in a row">${esc(S.drafts.steer)}</textarea>
            <div class="crow"><span class="hint">Stored first. Received and applied are recorded separately.</span><button class="btn primary" data-a="sendSteer" ${S.drafts.steer.trim()?"":"disabled"}>Send ⌘↵</button></div></div></div></div>
      <div class="pfoot"><span>omp ${c.pid}</span><span>tmux %0</span><span class="sp"></span><span>Specialist terminals are read-only. Steer through the coordinator.</span></div></section>`;
    const used = r.agents.filter(a=>a.state!=="ended").length;
    const slots = r.agents.map(tile);
    for (let i=used;i<3;i++) slots.push(`<button class="slot" data-a="picker"><span class="plus">+</span><b>Add a specialist</b><span class="hint">${3-used} of 3 specialist slots free. The coordinator receives your proposal.</span></button>`);
    const checks = r.checks.map(k=>`<div class="check"><span class="pill ${k.state==="Passed"?"green":k.state==="Running"?"blue":k.state==="Failed"?"red":"muted"}">${k.state}</span><b>${esc(k.name)}</b><code>@ ${esc(k.rev)}</code></div>`).join("");
    body = `${coordPane}<div class="gridlabel"><h2>Specialists</h2><span class="hint">${used} of 3 assigned · coordinator plus at most three specialists</span></div>
      <div class="grid">${slots.join("")}</div>
      <div class="gridlabel"><h2>Required checks</h2><span class="hint">Run in containers with no network. Each result names its revision.</span></div><div class="checks">${checks}</div>`;
  } else if (isRun){
    body = `<div class="empty"><h2>Run cancelled</h2><p class="hint">All agent processes stopped. The owned worktree, branch 4c1e9a2 and recorded evidence are kept. Continue later creates a linked successor run that needs fresh checks and review.</p></div>`;
  } else if (t.queue){
    body = `<div class="empty"><h2>Queued · #${t.queue} in the coding queue</h2><p class="hint">${esc(t.hold)}. No agent processes exist yet, so there are no terminals. The tiles below are the planned team, not running agents.</p>
      <div class="planned">${t.team.map(n=>`<div><b>${esc(n)}</b>Planned · not started</div>`).join("")}</div>
      <div class="iact"><button class="btn" data-a="toast" data-msg="Moved ${esc(t.key)} up in the local queue.">Move up</button><button class="btn" data-a="toast" data-msg="Removed ${esc(t.key)} from the queue. Its brief is kept.">Remove from queue</button></div></div>`;
  } else if (t.id==="t3"){
    body = `<div class="empty"><h2>Paused at the review gate</h2><p class="hint">PR ${t.pr} is ready for your review. Crewroom released the coding slot and never merges for you. Two new review comments arrived; Resume addresses them on the same branch and PR with fresh checks and review.</p>
      <div class="iact"><button class="btn primary" data-a="toast" data-msg="Opens PR #208 in Bitbucket (mock).">Open pull request</button><button class="btn" data-a="toast" data-msg="Resume requested. It waits for the coding slot.">Resume run</button></div></div>`;
  } else {
    body = `<div class="empty"><h2>Refining</h2><p class="hint">Explore develops the request; Grill challenges it. Both save proposals until you accept or discard them. Neither starts coding.</p>
      <div class="iact"><button class="btn" data-a="toast" data-msg="Explore queued. It needs an available runner.">Explore</button><button class="btn" data-a="toast" data-msg="Grill queued. It needs an available runner.">Grill</button><button class="btn primary" data-a="toast" data-msg="Research queued with brief r1.">Queue research</button></div></div>`;
  }
  return `<div class="work ${S.drawer.open?"withdrawer":""}"><div class="scroll"><div class="session">${head}${facts(t)}${steps(t,true)}${body}</div></div>${S.drawer.open?drawer(t):""}</div>`;
}

function drawer(t){
  const tabs = ["brief","results","history"].map(k=>`<button class="${S.drawer.tab===k?"on":""}" data-a="dtab" data-tab="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("");
  let b = "";
  if (S.drawer.tab==="brief"){
    b = `<div class="dsec"><h3>Accepted brief · revision ${t.brief.rev}</h3><p>${esc(t.brief.text)}</p></div>
      <div class="dsec"><h3>Acceptance criteria</h3><ol style="margin:0;padding-left:18px">${t.brief.criteria.map(c=>`<li>${esc(c)}</li>`).join("")}</ol></div>

      <div class="callout">Local refinements are kept separately from imported Jira fields. Save a new revision, then adopt it for the run with a reason. Earlier evidence may become stale.</div>
