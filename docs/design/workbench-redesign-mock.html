  } else if (S.drawer.tab==="results"){
    if (t.id==="t1") b = `<div class="dsec"><h3>Candidate revision</h3><p><code class="mono">4c1e9a2</code> · Implementer attempt 2 · 2 files, +41 −6</p></div>
      <div class="dsec"><h3>Acceptance coverage at 4c1e9a2</h3><table><tr><th>Criterion</th><th>Evidence</th><th>Status</th></tr>
        <tr><td>1 · Retried after rebalance</td><td class="mono">rebalance_offsets.spec</td><td><span class="pill green">Passing</span></td></tr>
        <tr><td>2 · Stale generation dropped</td><td class="mono">rebalance_offsets.spec</td><td><span class="pill green">Passing</span></td></tr>
        <tr><td>3 · One warning per rebalance</td><td class="mono">rebalance_warning.spec</td><td><span class="pill red">Failing</span></td></tr></table></div>
      <div class="dsec"><h3>Required checks</h3><table><tr><th>Check</th><th>Revision</th><th>Result</th></tr>${S.run.checks.map(k=>`<tr><td>${esc(k.name)}</td><td class="mono">${esc(k.rev)}</td><td>${esc(k.state)}</td></tr>`).join("")}</table></div>
      <div class="dsec"><h3>Independent review</h3><p class="hint">Not started. Waits for a candidate whose checks pass. The reviewer must not have written the change.</p></div>
      <div class="dsec"><h3>Why it is not ready</h3><ul class="reasons"><li>Unit tests still running at 4c1e9a2</li><li>Criterion 3 failing</li><li>No independent review</li></ul></div>
      <div class="callout">A quiet terminal is never a quality gate. Readiness comes only from checks and review at the same revision.</div>`;
    else if (t.id==="t3") b = `<div class="dsec"><h3>Candidate revision</h3><p><code class="mono">9b20c4e</code> · PR #208</p></div><div class="dsec"><h3>Checks at 9b20c4e</h3><table><tr><th>Check</th><th>Result</th></tr><tr><td>docs build</td><td>Passed</td></tr><tr><td>link check</td><td>Passed</td></tr></table></div><div class="dsec"><h3>Independent review</h3><p>Approved at <code class="mono">9b20c4e</code> by Independent reviewer (attempt 1).</p></div><div class="dsec"><h3>Hosted pipeline</h3><p>Passed for head 9b20c4e.</p></div>`;
    else b = `<p class="hint">No candidate revision yet. Results appear when a run produces one.</p>`;
  } else {
    if (t.id==="t1") b = `<div class="dsec"><h3>Attempts in this run</h3><table><tr><th>Agent</th><th>Model</th><th>Usage</th></tr>
      <tr><td>Coordinator · 1</td><td class="mono">opus 5.5 · xhigh</td><td>412k in / 38k out <span class="hint">actual</span></td></tr>
      <tr><td>Implementer · 1</td><td class="mono">sonnet 5.5 · high</td><td>182k in / 21k out <span class="hint">actual</span></td></tr>
      <tr><td>Implementer · 2</td><td class="mono">sonnet 5.5 · high</td><td><span class="hint">unavailable · provider did not report</span></td></tr>
      <tr><td>Test architect · 1</td><td class="mono">sonnet 5.5 · high</td><td>64k in / 9k out <span class="hint">actual</span></td></tr></table></div>
      <div class="dsec"><h3>Captured configuration</h3><p class="hint">Each assignment keeps the role revision, principles and model it started with. Implementer runs revision 2.</p></div>`;
    else b = `<p class="hint">No earlier runs for this ticket.</p>`;
  }
  return `<aside class="drawer" aria-label="Ticket details"><div class="tabs">${tabs}<button class="btn ghost sm x" data-a="drawer" aria-label="Close details">✕</button></div><div class="dbody">${b}</div></aside>`;
}

function inbox(){
  const list = S.inbox.filter(i=>S.inboxFilter==="all"||i.status==="open");
  const kinds = {repair:"Repair limit",learning:"Learning proposal",requirements:"Requirement change",feedback:"PR feedback"};
  const card = i => {
    const t = ticket(i.ticket); let extra = "", acts = "";
    if (i.status!=="open") return `<div class="ibox done k-${i.kind}"><span class="stripe"></span><div class="ibody"><div class="ihead"><span class="kind">${kinds[i.kind]} · ${esc(t.key)}</span><h3>${esc(i.title)}</h3></div><p class="hint">${esc(i.result)}</p></div></div>`;
    if (i.kind==="repair") acts = `<button class="btn primary" data-a="allowRepair" data-id="${i.id}">Allow one more cycle</button><button class="btn" data-a="resolve" data-id="${i.id}" data-result="Kept blocked. The coordinator was told to replan without more repair.">Keep blocked</button><button class="btn ghost" data-a="ticket" data-id="${t.id}">Open session</button>`;
    if (i.kind==="learning"){
      const r = role(i.role);
      extra = `<p class="hint">${esc(i.from)} · Reason: ${esc(i.reason)}</p><div class="diff"><div>${esc(r.instructions)}</div><div class="add">+ ${esc(i.add)}</div></div>
        <div class="field"><label for="reason-${i.id}">Your reason (recorded with the decision)</label><input type="text" id="reason-${i.id}" data-bind="drafts.reason_${i.id}" value="${esc(S.drafts["reason_"+i.id]||"")}" placeholder="e.g. Reviews must run the named scenarios"></div>
        <p class="hint">Approval creates ${esc(r.name)} revision ${r.revision+1}. Running assignments keep revision ${r.revision}.</p>`;
      acts = `<button class="btn primary" data-a="approveLearning" data-id="${i.id}">Approve</button><button class="btn" data-a="resolve" data-id="${i.id}" data-result="Rejected. The proposal is kept in history.">Reject</button><button class="btn ghost" data-a="openRole" data-role="${r.id}">Open role</button>`;
    }
    if (i.kind==="requirements") acts = `<button class="btn primary" data-a="reviewBrief" data-id="${i.id}">Review brief</button><button class="btn" data-a="resolve" data-id="${i.id}" data-result="Kept brief revision 2. Jira text is retained as an unadopted change.">Keep current brief</button>`;
    if (i.kind==="feedback") acts = `<button class="btn primary" data-a="resolve" data-id="${i.id}" data-result="Resume requested for PILOT-REDACTED. It waits for the coding slot.">Resume run</button><button class="btn ghost" data-a="ticket" data-id="${t.id}">Open session</button>`;
    return `<div class="ibox k-${i.kind}"><span class="stripe"></span><div class="ibody"><div class="ihead"><span class="kind">${kinds[i.kind]} · ${esc(t.key)}</span><h3>${esc(i.title)}</h3></div>${i.detail?`<p>${esc(i.detail)}</p>`:""}${extra}<div class="iact">${acts}</div></div></div>`;
  };
  return `<div class="scroll"><div class="page"><div><h1>Needs you</h1><p class="hint">Every decision the workflow is waiting on, in one place. Nothing here proceeds without you.</p></div>
    <div class="filters"><button class="btn sm ${S.inboxFilter==="open"?"primary":""}" data-a="ifilter" data-f="open">Open (${openInbox().length})</button><button class="btn sm ${S.inboxFilter==="all"?"primary":""}" data-a="ifilter" data-f="all">All</button></div>
    ${list.map(card).join("") || `<div class="empty"><h2>Nothing needs you</h2><p class="hint">Repair limits, learning proposals, requirement changes and PR feedback appear here.</p></div>`}</div></div>`;
}

/* ---------- settings ---------- */
function settings(){
  const tabs = [["roles","Agent roles"],["models","Models & budget"],["playbooks","Playbooks"],["principles","Principles"],["repos","Repositories"]];
  let body = "";
  if (S.settingsTab==="roles") body = rolesPage();
  if (S.settingsTab==="models") body = modelsPage();
  if (S.settingsTab==="playbooks") body = playbooksPage();
  if (S.settingsTab==="principles") body = principlesPage();
  if (S.settingsTab==="repos") body = `<div class="page"><h1>Repositories</h1><div class="rcard"><div class="top"><h3>conductor</h3><span class="pill green">Valid</span></div><p class="hint mono">target main · rebase policy · instructions AGENTS.md</p><div class="chips"><span class="chip">typecheck</span><span class="chip">unit tests</span><span class="chip">e2e</span></div><p class="hint">Checks run in pinned local images with no network. Crewroom uses owned worktrees and leaves your checkout untouched.</p></div></div>`;
  return `<div class="settings"><nav class="snav" aria-label="Settings sections"><div class="h">Settings</div>${tabs.map(([k,l])=>`<button class="${S.settingsTab===k?"on":""}" data-a="stab" data-tab="${k}">${l}</button>`).join("")}</nav><div class="scroll">${body}</div></div>`;
}
function rolesPage(){
  const q = S.roleSearch.toLowerCase();
  const pend = r => openInbox().filter(i=>i.kind==="learning"&&i.role===r.id).length;
  const list = S.roles.filter(r=>(!q || (r.name+" "+r.purpose+" "+r.category).toLowerCase().includes(q)) && (S.roleFilter==="all" || (S.roleFilter==="on"?r.enabled:!r.enabled)));
  const card = r => {
    const m = resolve(r);
    const toggle = r.core||r.fixed ? `<span class="lock" title="${r.fixed?"Assigned to every run":"Required by the coding workflow"}">🔒 ${r.fixed?"Always assigned":"Core role · always on"}</span>`
      : `<button class="toggle ${r.enabled?"on":""}" data-a="toggleRole" data-role="${r.id}" aria-pressed="${r.enabled}"><i></i>${r.enabled?"Enabled":"Disabled"}</button>`;
    return `<div class="rcard ${r.enabled?"":"off"}"><div class="top"><h3>${esc(r.name)}</h3>${pend(r)?`<span class="pending">${pend(r)} proposal</span>`:""}<span class="chip">r${r.revision}</span></div>
      <p class="when">${esc(r.purpose)}</p>
      <div class="chips"><span class="chip" title="Job type">${JOBS[m.job].name}</span><span class="chip">${esc(short(m.model))} · ${esc(m.effort)}${m.overridden?" *":""}</span><span class="chip">${r.principles.length} principles</span></div>
      <div class="bottom">${toggle}<span class="sp"></span><span class="hint">${r.used} runs</span><button class="btn sm" data-a="dup" data-role="${r.id}">Duplicate</button><button class="btn sm" data-a="openRole" data-role="${r.id}">Edit</button></div></div>`;
  };
  const groups = CATS.map(c=>{const rs=list.filter(r=>r.category===c); return rs.length?`<div class="cat">${c}<span>${rs.length}</span></div><div class="cards">${rs.map(card).join("")}</div>`:""}).join("");
  return `<div class="page" style="max-width:1200px"><div><h1>Agent roles</h1><p class="hint">Reusable specialties saved in your user configuration. The coordinator reads each role's “pick when” text to decide whom to assign. Changes apply to new assignments only.</p></div>
    <div class="toolbar"><input type="search" id="role-search" data-bind="roleSearch" value="${esc(S.roleSearch)}" placeholder="Search roles" aria-label="Search roles">
      <select data-change="roleFilter" aria-label="Filter"><option value="all" ${S.roleFilter==="all"?"selected":""}>All roles</option><option value="on" ${S.roleFilter==="on"?"selected":""}>Enabled</option><option value="off" ${S.roleFilter==="off"?"selected":""}>Disabled</option></select>
      <span class="hint">${S.roles.length} roles · ${S.roles.filter(r=>r.enabled).length} enabled</span><span style="flex:1"></span>
      <button class="btn primary" data-a="describe">${ICON.plus.replace("<svg","<svg width='14' height='14'")} New specialist</button></div>${groups||'<p class="hint">No roles match.</p>'}</div>`;
}
function modelsPage(){
  const rows = Object.entries(JOBS).map(([k,j])=>`<tr><td><b>${j.name}</b><br><span class="hint">${j.desc}</span></td>
    <td><select data-change="job" data-job="${k}" aria-label="${j.name} model">${MODELS.map(m=>`<option ${S.jobs[k]===m?"selected":""}>${m}</option>`).join("")}</select></td>
    <td class="mono">${BUDGETS[S.budget].effort[k]}</td><td>${S.roles.filter(r=>r.job===k).length}</td></tr>`).join("");
  return `<div class="page"><div><h1>Models &amp; budget</h1><p class="hint">Roles choose a job, not a model. Change a job's model here and every role on that job uses it for new assignments, unless the role overrides it.</p></div>
    <div class="fsec"><h3>Budget</h3><div class="seg" role="group" aria-label="Budget">${Object.entries(BUDGETS).map(([k,b])=>`<button class="${S.budget===k?"on":""}" data-a="budget" data-b="${k}" style="padding:6px 14px">${b.name}</button>`).join("")}</div>
      <p class="hint">Budget sets reasoning effort for every job at once. Availability is checked before launch.</p></div>
    <div style="overflow-x:auto"><table><tr><th>Job</th><th>Model</th><th>Effort at ${BUDGETS[S.budget].name}</th><th>Roles</th></tr>${rows}</table></div>
    <div class="callout">Recorded usage stays labeled as actual, estimated or unavailable. No monetary ceiling is enforced without reliable accounting.</div></div>`;
}
function playbooksPage(){
  return `<div class="page"><div><h1>Playbooks</h1><p class="hint">The coordinator proposes a playbook for each ticket; you can change it before or during a run. Its steps are copied into the run as a checklist. A skipped step stays visible with its reason. Steps never count as evidence.</p></div>
    <div class="cards">${PLAYBOOKS.map(p=>`<div class="rcard"><div class="top"><h3>${p.name}</h3><span class="chip">${p.steps.length} steps</span></div><p class="when">${esc(p.when)}</p><ol style="margin:0;padding-left:18px;font-size:12px">${p.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`).join("")}</div></div>`;
}
function principlesPage(){
  return `<div class="page"><div><h1>Principles</h1><p class="hint">Short engineering rules you attach to roles. Each assignment captures the principle text it started with. The set follows the approach of Lauren Tan's pstack; the wording here is Crewroom's own.</p></div>
    <div class="cards">${PRINCIPLES.map(p=>`<div class="rcard"><div class="top"><h3>${p.name}</h3></div><p class="when">${esc(p.text)}</p><div class="bottom"><span class="hint">Attached to ${S.roles.filter(r=>r.principles.includes(p.id)).length} roles</span></div></div>`).join("")}</div></div>`;
}

/* ---------- role editor ---------- */
const FIELDS = ["name","category","purpose","instructions","job","model","effort","principles","enabled"];
function openEditor(id, draft, drafted){
  const r = id==="new" ? null : role(id);
  const base = r ? JSON.parse(JSON.stringify(Object.fromEntries(FIELDS.map(f=>[f,r[f]])))) : {name:"",category:"Quality",purpose:"",instructions:"",job:"judgment",model:"",effort:"",principles:["evidence"],enabled:true};
  S.editor = {id, draft:draft||base, base:r?base:{}, drafted:drafted||[], ask:"", proposal:null, advanced:!!(base.model||base.effort), preview:false, previewTicket:"t1", confirmClose:false, openRev:null, asking:false};
}
const dirty = () => S.editor && JSON.stringify(S.editor.draft)!==JSON.stringify(S.editor.base);
function editorSheet(){
  const e = S.editor, d = e.draft, r = e.id==="new"?null:role(e.id);
  const m = resolve({...d});
  const tag = f => e.drafted.includes(f)?'<span class="drafted">Drafted</span>':"";
  const ro = r && (r.core||r.fixed);
  const principles = PRINCIPLES.map(p=>`<button class="pchip ${d.principles.includes(p.id)?"on":""}" data-a="pToggle" data-p="${p.id}" title="${esc(p.text)}">${p.name}</button>`).join("");
  const proposal = e.asking ? `<p class="hint"><span class="spinner"></span> Drafting a change with the Judgment model…</p>` : e.proposal ? `<div class="diff">${d.instructions.split("\n").map(l=>`<div>${esc(l)}</div>`).join("")}<div class="add">+ ${esc(e.proposal)}</div></div><div class="iact"><button class="btn sm primary" data-a="askAccept">Accept change</button><button class="btn sm" data-a="askDiscard">Discard</button></div>` : "";
  const revs = r ? r.revisions.slice().reverse().map(v=>`<div class="rev"><div class="rh"><b>Revision ${v.rev}</b><span class="hint">${esc(v.at)} · ${esc(v.note)}</span>${v.rev===r.revision?'<span class="pill green">Current</span>':""}<span style="flex:1"></span><button class="btn sm ghost" data-a="revToggle" data-rev="${v.rev}">${e.openRev===v.rev?"Hide":"Show"}</button></div>${e.openRev===v.rev?`<div class="diff" style="margin-top:6px"><div>${esc(v.instructions)}</div></div>`:""}</div>`).join("") : `<p class="hint">Saved as revision 1.</p>`;
  const tk = ticket(e.previewTicket);
  const preview = e.preview ? `<div class="field"><label for="pv-t">Preview against</label><select id="pv-t" data-change="previewTicket">${S.tickets.map(t=>`<option value="${t.id}" ${t.id===e.previewTicket?"selected":""}>${t.key} · ${esc(t.title)}</option>`).join("")}</select></div>
<div class="preview"># Assignment: ${esc(d.name||"Untitled role")} (revision ${r?r.revision+(dirty()?1:0):1}${dirty()?", unsaved":""})
Ticket: ${esc(tk.key)} · ${esc(tk.title)}
Playbook: ${esc(PLAYBOOKS.find(p=>p.id===tk.playbook).name)}

## Accepted brief (revision ${tk.brief.rev})
${esc(tk.brief.text)}

## Acceptance criteria
${tk.brief.criteria.map((c,i)=>`${i+1}. ${esc(c)}`).join("\n")}

## Why you were picked
${esc(d.purpose||"(empty)")}

## Role instructions
${esc(d.instructions||"(empty)")}

## Principles
${d.principles.map(id=>{const p=PRINCIPLES.find(x=>x.id===id);return `- ${p.name}: ${p.text}`}).join("\n")||"(none)"}

## Project guidance (conductor/AGENTS.md, captured at assignment)
- Run npm test for domain changes and npm run build for type changes.
- Keep credentials server-side.

## Tools
${TOOLS.map(t=>"- "+t).join("\n")}

## Model
${esc(m.model)} · effort ${esc(m.effort)} (${JOBS[m.job].name} job, ${BUDGETS[S.budget].name} budget${m.overridden?", role override":""})</div>` : "";
  return `<div class="sheet-bg" data-a="sheetBg"><div class="sheet" role="dialog" aria-label="Edit role" data-stop="1">
    <div class="sheet-head"><h2>${e.id==="new"?"New specialist":esc(r.name)}</h2>${r?`<span class="chip">Editing revision ${r.revision}</span>`:""}${dirty()?'<span class="pill amber">Unsaved changes</span>':""}<button class="btn ghost icon" data-a="closeEditor" aria-label="Close">✕</button></div>
    <div class="sheet-body">
      <div class="fsec"><h3>Identity</h3><div class="row2">
        <div class="field"><label for="ed-name">Name ${tag("name")}</label><input type="text" id="ed-name" data-bind="editor.draft.name" value="${esc(d.name)}" placeholder="e.g. Kafka consumer reviewer"></div>
        <div class="field"><label for="ed-cat">Category ${tag("category")}</label><select id="ed-cat" data-change="edCategory">${CATS.map(c=>`<option ${d.category===c?"selected":""}>${c}</option>`).join("")}</select></div></div>
        <p class="hint mono">id: ${esc(r?r.id:slug(d.name))}${r?" (fixed)":" (generated from the name)"}</p></div>
      <div class="fsec"><h3>When should the coordinator pick this role? ${tag("purpose")}</h3>
        <textarea id="ed-purpose" data-bind="editor.draft.purpose" rows="2" placeholder="Pick when…">${esc(d.purpose)}</textarea>
        <p class="hint">The coordinator reads this line when choosing a team. Start with “Pick when”.</p></div>
      <div class="fsec"><h3>Instructions ${tag("instructions")}</h3>
        <textarea id="ed-instr" data-bind="editor.draft.instructions" rows="5">${esc(d.instructions)}</textarea>
        <div class="crow"><input type="text" id="ed-ask" data-bind="editor.ask" value="${esc(e.ask)}" placeholder="Ask for a change, e.g. “always quote the failing test name”"><button class="btn" data-a="ask" ${e.ask.trim()?"":"disabled"}>Propose change</button></div>${proposal}</div>
      <div class="fsec"><h3>Principles ${tag("principles")}</h3><div class="pchips">${principles}</div></div>
      <div class="fsec"><h3>Model ${tag("job")}</h3>
        <div class="seg" role="group" aria-label="Job type">${Object.entries(JOBS).map(([k,j])=>`<button class="${d.job===k?"on":""}" data-a="edJob" data-job="${k}" style="padding:5px 12px">${j.name}</button>`).join("")}</div>
        <div class="resolve">Resolves to <b>${esc(m.model)}</b> · effort <b>${esc(m.effort)}</b> <span class="hint">(${JOBS[m.job].name} job at ${BUDGETS[S.budget].name} budget${m.overridden?", overridden below":""})</span></div>
        <details ${e.advanced?"open":""} data-a="advToggle"><summary>Advanced: override for this role</summary><div class="row2" style="margin-top:8px">
          <div class="field"><label for="ed-model">Model</label><select id="ed-model" data-change="edModel"><option value="">Use job model</option>${MODELS.map(x=>`<option ${d.model===x?"selected":""}>${x}</option>`).join("")}</select></div>
          <div class="field"><label for="ed-effort">Effort</label><select id="ed-effort" data-change="edEffort"><option value="">Use budget</option>${EFFORTS.map(x=>`<option ${d.effort===x?"selected":""}>${x}</option>`).join("")}</select></div></div></details></div>
      <div class="fsec"><h3>Tools</h3><div class="toolslist">${TOOLS.map(t=>`<span>${t}</span>`).join("")}</div><p class="hint">Set by Crewroom for every specialist and contained to the owned worktree. Not configurable per role.</p></div>
      <div class="fsec"><h3>Availability</h3>${ro?`<p class="lock">🔒 ${r.fixed?"Assigned to every run.":"Required by the coding workflow, so it cannot be disabled."}</p>`:`<button class="toggle ${d.enabled?"on":""}" data-a="edEnabled"><i></i>${d.enabled?"Enabled for new assignments":"Disabled"}</button>`}</div>
      <div class="fsec"><h3>What this specialist receives</h3><div><button class="btn sm" data-a="previewToggle">${e.preview?"Hide preview":"Preview assembled brief"}</button></div>${preview}</div>
      <div class="fsec"><h3>Revisions</h3><div class="revs">${revs}</div></div>
    </div>
    <div class="sheet-foot">${e.confirmClose?`<span class="hint" style="color:var(--amber)">Discard unsaved changes?</span><button class="btn danger" data-a="discard">Discard</button><button class="btn" data-a="keepEditing">Keep editing</button>`:`<span class="hint">${r?`Saving creates revision ${r.revision+1}. Running assignments keep revision ${r.revision}.`:"Saving creates revision 1. Existing assignments are not affected."}</span><button class="btn" data-a="closeEditor">Cancel</button><button class="btn primary" data-a="saveRole" ${dirty()&&d.name.trim()?"":"disabled"}>Save role</button>`}</div>
  </div></div>`;
}

/* ---------- modals ---------- */
function modal(){
  const m = S.modal; if (!m) return "";
  let h="", b="", f="";
  if (m.type==="picker"){
    const q = (m.q||"").toLowerCase();
    const roles = S.roles.filter(r=>r.enabled && !r.fixed && (!q || (r.name+" "+r.purpose).toLowerCase().includes(q)));
    const t = ticket("t1");
    const team = ["Coordinator",...S.run.agents.filter(a=>a.state!=="ended").map(a=>role(a.roleId).name)];
    h = "Add a specialist";
    b = `<input type="search" id="pk-q" data-bind="modal.q" value="${esc(m.q||"")}" placeholder="Search by name or when to pick" aria-label="Search roles">
      <div class="rolepick">${CATS.map(c=>{const rs=roles.filter(r=>r.category===c);return rs.length?`<div class="cat">${c}</div>`+rs.map(r=>`<button class="ropt ${m.roleId===r.id?"on":""}" data-a="pick" data-role="${r.id}"><b>${esc(r.name)}</b><span class="chip">${short(resolve(r).model)}</span><small>${esc(r.purpose)}</small></button>`).join(""):""}).join("")||'<p class="hint">No enabled roles match. Create one in Settings → Agent roles.</p>'}</div>
      <div class="field"><label for="pk-a">Assignment</label><textarea id="pk-a" data-bind="modal.assignment" rows="2" placeholder="What should this specialist do in this run?">${esc(m.assignment||"")}</textarea></div>
      <div class="field"><label>Depends on (optional)</label><div class="checkrow">${team.map(n=>`<button class="cbx ${m.deps.includes(n)?"on":""}" data-a="pkDep" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div></div>
      <div class="field"><label>Covers criteria (optional)</label><div class="checkrow">${t.brief.criteria.map((c,i)=>`<button class="cbx ${m.crit.includes(i)?"on":""}" data-a="pkCrit" data-v="${i}">${i+1}. ${esc(c)}</button>`).join("")}</div></div>`;
    f = `<span class="hint">A proposal is not an agent. It starts at the next safe coordination point.</span><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="propose" ${m.roleId&&(m.assignment||"").trim()?"":"disabled"}>Propose specialist</button>`;
  }
  if (m.type==="teach"){
    const a = findAgent(m.agentId); const r = role(a.roleId);
    h = `Teach ${r.name}`;
    b = `<p class="hint">Describe what this role should do differently. Crewroom turns it into a proposed revision with a diff. You approve it in Needs you; nothing changes until then, and running assignments keep their revision.</p>
      <div class="field"><label for="tc-t">Feedback</label><textarea id="tc-t" data-bind="modal.text" rows="3" placeholder="e.g. Run the full consumer suite before reporting a candidate, not just the file you edited.">${esc(m.text||"")}</textarea></div>
      <button class="cbx ${m.ctx?"on":""}" data-a="tcCtx">Attach the last 20 lines of this terminal as context</button>`;
    f = `<button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="teachSend" ${(m.text||"").trim()?"":"disabled"}>Create proposal</button>`;
  }
  if (m.type==="describe"){
    h = "New specialist";
    b = m.drafting ? `<p><span class="spinner"></span> Drafting a role from your description with the Judgment model (${esc(S.jobs.judgment)})…</p><p class="hint">Runs as a short recorded process through the runner. If the runner is unavailable you can still fill in the form yourself.</p>`
      : `<div class="field"><label for="ds-t">What should this specialist do?</label><textarea id="ds-t" data-bind="modal.text" rows="4" placeholder="e.g. Someone who checks Kafka consumer changes for offset and rebalance bugs before review.">${esc(m.text||"")}</textarea></div>
      <div class="field"><label for="ds-f">Start from</label><select id="ds-f" data-change="dsFrom"><option value="">Nothing (draft from the description)</option>${S.roles.filter(r=>!r.fixed).map(r=>`<option value="${r.id}" ${m.from===r.id?"selected":""}>${esc(r.name)}</option>`).join("")}</select></div>
      <p class="hint">You review every drafted field before saving. Drafted fields are marked.</p>`;
    f = m.drafting ? "" : `<button class="btn ghost" data-a="blankRole">Fill in the form myself</button><span style="flex:1"></span><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="draftRole" ${(m.text||"").trim()?"":"disabled"}>Draft role</button>`;
  }
  if (m.type==="playbook"){
    const p = PLAYBOOKS.find(x=>x.id===m.to);
    h = "Change the playbook?";
    b = `<p>Switching this run to <b>${p.name}</b> sends a steering message to the coordinator. It replans at the next safe point. Completed steps and their evidence are kept.</p>`;
    f = `<button class="btn" data-a="closeModal">Keep current</button><button class="btn primary" data-a="pbYes">Send to coordinator</button>`;
  }
  if (m.type==="newTicket"){
    h = "New ticket";
    b = `<div class="field"><label for="nt-t">Title</label><input type="text" id="nt-t" data-bind="modal.title" value="${esc(m.title||"")}"></div><div class="field"><label for="nt-d">Request</label><textarea id="nt-d" data-bind="modal.text" rows="3">${esc(m.text||"")}</textarea></div>`;
    f = `<button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="createTicket" ${(m.title||"").trim()?"":"disabled"}>Create ticket</button>`;
  }
  return `<div class="modal-bg" data-a="modalBg"><div class="modal" role="dialog" aria-label="${esc(h)}" data-stop="1"><div class="modal-head"><h2>${esc(h)}</h2><button class="btn ghost icon" data-a="closeModal" aria-label="Close">✕</button></div><div class="modal-body">${b}</div>${f?`<div class="modal-foot">${f}</div>`:""}</div></div>`;
}

function maxOverlay(){
  if (!S.maxAgent || S.view!=="session" || S.selected!=="t1") return "";
  const a = findAgent(S.maxAgent); if (!a) return "";
  return `<div class="maxwrap"><section class="pane">${agentHead(a,a.id==="coord")}${agentBody(a)}<div class="pfoot"><span>omp ${a.pid}</span><span class="sp"></span><span>Esc to restore</span></div></section></div>`;
}

/* ---------- render ---------- */
const app = document.getElementById("app");
function render(){
  const ae = document.activeElement; const fid = ae && ae.id; let s1, s2;
  try { s1 = ae.selectionStart; s2 = ae.selectionEnd; } catch {}
  const scrolls = {}; document.querySelectorAll(".scroll,.dbody,.sheet-body,.term,.tl,.steer-log").forEach((el,i)=>{ scrolls[(el.id||el.className)+i] = [el.scrollTop, el.scrollHeight-el.clientHeight-el.scrollTop < 8]; });
  const main = S.view==="inbox" ? inbox() : S.view==="settings" ? settings() : session();
  app.innerHTML = `${sidebar()}<section class="main"><div class="mobilebar"><button class="btn icon" data-a="nav" aria-label="Sessions and settings">${ICON.menu}</button><b>${S.view==="inbox"?"Needs you":S.view==="settings"?"Settings":esc(ticket(S.selected)?.key||"")}</b><span class="badge ${openInbox().length?"":"zero"}" style="margin-left:auto">${openInbox().length}</span></div>${main}
    <div class="statusbar"><span>Jira synchronized</span><span>Runner available</span><span>Mail connected</span><span class="right">Changes saved on this machine</span></div>${maxOverlay()}</section>
    ${S.editor?editorSheet():""}${modal()}<div class="toasts" aria-live="polite">${S.toasts.map(t=>`<div class="toast ${t.warn?"warn":""}">${esc(t.msg)}</div>`).join("")}</div>`;
  document.querySelectorAll(".scroll,.dbody,.sheet-body,.term,.tl,.steer-log").forEach((el,i)=>{ const v = scrolls[(el.id||el.className)+i]; if (el.classList.contains("term")||el.classList.contains("tl")||el.classList.contains("steer-log")) { if (!v || v[1]) el.scrollTop = el.scrollHeight; else el.scrollTop = v[0]; } else if (v) el.scrollTop = v[0]; });
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus({preventScroll:true}); try{ if (s1!=null) el.setSelectionRange(s1,s2);}catch{} } }
}
function toast(msg, warn){ const t={id:nid("t"),msg,warn}; S.toasts.push(t); render(); setTimeout(()=>{S.toasts=S.toasts.filter(x=>x!==t); render();}, 4200); }
function findAgent(id){ return id==="coord" ? S.run.coord : S.run.agents.find(a=>a.id===id); }
function setPath(path, v){ const k = path.split("."); let o = S; for (let i=0;i<k.length-1;i++) o = o[k[i]]; o[k[k.length-1]] = v; }

/* ---------- actions ---------- */
const A = {
  go:d=>{ S.view=d.view; S.navOpen=false; S.menu=null; S.maxAgent=null; },
  nav:()=>{ S.navOpen=!S.navOpen; },
  ticket:d=>{ S.view="session"; S.selected=d.id; S.navOpen=false; S.maxAgent=null; },
  drawer:()=>{ S.drawer.open=!S.drawer.open; },
  dtab:d=>{ S.drawer.tab=d.tab; S.drawer.open=true; },
  mode:d=>{ findAgent(d.id).mode=d.mode; },
  max:d=>{ S.maxAgent = S.maxAgent===d.id?null:d.id; S.menu=null; },
  menu:d=>{ S.menu = S.menu===d.id?null:d.id; },
  toast:d=>{ toast(d.msg); return false; },
  pause:()=>{ const r=S.run; r.status="pausing"; setTimeout(()=>{ r.status="paused"; [r.coord,...r.agents].forEach(a=>{ if(a.state==="executing") a.state="paused"; }); render(); toast("Paused. All agent processes stopped at a safe point."); },1800); },
  resume:()=>{ const r=S.run; r.status="resuming"; setTimeout(()=>{ r.status="running"; [r.coord,...r.agents].forEach(a=>{ if(a.state==="paused") a.state="executing"; }); deliverPending(); scheduleProposed(); render(); toast("Resumed. Saved steering is being delivered."); },1200); },
  cancelAsk:()=>{ S.run.confirmCancel=true; },
  cancelNo:()=>{ S.run.confirmCancel=false; },
  cancelYes:()=>{ const r=S.run; r.confirmCancel=false; r.status="cancelled"; r.agents=r.agents.filter(a=>a.state!=="proposed"); [r.coord,...r.agents].forEach(a=>a.state="ended"); S.maxAgent=null; toast("Run cancelled. Changes, evidence and the branch are kept."); },
  continueLater:()=>{ toast("Linked successor queued from branch 4c1e9a2. It needs fresh checks and review."); return false; },
  sendSteer:()=>{ sendSteer(); },
  picker:()=>{ S.modal={type:"picker",q:"",roleId:null,assignment:"",deps:[],crit:[]}; },
  pick:d=>{ S.modal.roleId=d.role; },
  pkDep:d=>{ const a=S.modal.deps; const i=a.indexOf(d.v); i<0?a.push(d.v):a.splice(i,1); },
  pkCrit:d=>{ const a=S.modal.crit; const v=+d.v; const i=a.indexOf(v); i<0?a.push(v):a.splice(i,1); },
  propose:()=>{ const m=S.modal; const ag={id:nid("a-"),roleId:m.roleId,attempt:1,state:"proposed",lines:[],timeline:[],cursor:0,last:now(),mode:"terminal",pid:4100+seq,pane:"%"+(seq%9),assignment:m.assignment,deps:m.deps.slice()}; S.run.agents.push(ag); S.modal=null; scheduleProposed(); toast(`Proposed ${role(m.roleId).name}. It starts at the next safe coordination point.`); },
  withdraw:d=>{ S.run.agents=S.run.agents.filter(a=>a.id!==d.id); toast("Proposal withdrawn. It is kept in history."); },
  askRetire:d=>{ const r=role(findAgent(d.id).roleId); S.menu=null; S.drafts.steer=`Please retire the ${r.name} assignment when its results are reconciled.`; toast("Draft added to the coordinator message box. Review it and send."); return false; },
  teach:d=>{ S.menu=null; S.modal={type:"teach",agentId:d.id,text:"",ctx:true}; },
  tcCtx:()=>{ S.modal.ctx=!S.modal.ctx; },
  teachSend:()=>{ const m=S.modal; const a=findAgent(m.agentId); const r=role(a.roleId); S.inbox.unshift({id:nid("i"),kind:"learning",ticket:"t1",role:r.id,title:`You proposed a change to ${r.name}`,reason:m.ctx?"Operator feedback with 20 lines of terminal context.":"Operator feedback.",add:m.text.trim(),from:"You · PILOT-REDACTED",status:"open"}); S.modal=null; toast(`Proposal for ${r.name} added to Needs you. Nothing changes until you approve it.`); },
  closeModal:()=>{ S.modal=null; },
  modalBg:(d,el,e)=>{ if (e.target===el) S.modal=null; else return false; },
  ifilter:d=>{ S.inboxFilter=d.f; },
  resolve:d=>{ const i=S.inbox.find(x=>x.id===d.id); i.status="done"; i.result=d.result; toast(d.result); },
  allowRepair:d=>{ const i=S.inbox.find(x=>x.id===d.id); i.status="done"; i.result="Allowed one more repair cycle. Implementer attempt 3 started."; const a=S.run.agents.find(a=>a.roleId==="implementer"); if(a){ a.state=S.run.status==="running"?"executing":"paused"; a.attempt=3; a.lines.push("— attempt 3 · repair cycle allowed by operator —"); a.cursor=8; a.last=now(); } toast(i.result); },
  approveLearning:d=>{ const i=S.inbox.find(x=>x.id===d.id); const r=role(i.role); r.instructions += "\n" + i.add; r.revision++; r.revisions.push({rev:r.revision,at:"2026-10-04",note:"Approved learning proposal"+(S.drafts["reason_"+i.id]?": "+S.drafts["reason_"+i.id]:""),instructions:r.instructions,purpose:r.purpose}); i.status="done"; i.result=`Approved. ${r.name} is now revision ${r.revision}; running assignments keep revision ${r.revision-1}.`; toast(i.result); },
  reviewBrief:d=>{ const i=S.inbox.find(x=>x.id===d.id); i.status="done"; i.result="Opened the brief to compare and adopt."; S.view="session"; S.selected=i.ticket; S.drawer={open:true,tab:"brief"}; },
  stab:d=>{ S.settingsTab=d.tab; },
  toggleRole:d=>{ const r=role(d.role); r.enabled=!r.enabled; toast(`${r.name} ${r.enabled?"enabled":"disabled"} for new assignments.`); },
  dup:d=>{ const r=role(d.role); openEditor("new", {name:r.name+" (copy)",category:r.category,purpose:r.purpose,instructions:r.instructions,job:r.job,model:r.model,effort:r.effort,principles:r.principles.slice(),enabled:true}, []); },
  openRole:d=>{ S.menu=null; S.view="settings"; S.settingsTab="roles"; openEditor(d.role); },
  describe:()=>{ S.modal={type:"describe",text:"",from:"",drafting:false}; },
  blankRole:()=>{ S.modal=null; openEditor("new"); },
  draftRole:()=>{ S.modal.drafting=true; const {text,from}=S.modal; setTimeout(()=>{ const dr=draftFrom(text,from); S.modal=null; openEditor("new",dr,["name","category","purpose","instructions","principles","job"]); render(); },1300); },
  closeEditor:()=>{ if (dirty()) S.editor.confirmClose=true; else S.editor=null; },
  sheetBg:(d,el,e)=>{ if (e.target===el){ if (dirty()) S.editor.confirmClose=true; else S.editor=null; } else return false; },
  discard:()=>{ S.editor=null; },
  keepEditing:()=>{ S.editor.confirmClose=false; },
  pToggle:d=>{ const p=S.editor.draft.principles; const i=p.indexOf(d.p); i<0?p.push(d.p):p.splice(i,1); },
  edJob:d=>{ S.editor.draft.job=d.job; },
  edEnabled:()=>{ S.editor.draft.enabled=!S.editor.draft.enabled; },
  advToggle:(d,el,e)=>{ if (e.target.tagName==="SUMMARY"){ setTimeout(()=>{ S.editor.advanced=el.open; },0); } return false; },
  previewToggle:()=>{ S.editor.preview=!S.editor.preview; },
  revToggle:d=>{ const v=+d.rev; S.editor.openRev = S.editor.openRev===v?null:v; },
  ask:()=>{ const e=S.editor; e.asking=true; const q=e.ask.trim(); setTimeout(()=>{ e.asking=false; e.proposal = q.charAt(0).toUpperCase()+q.slice(1).replace(/\.?$/,"."); render(); },900); },
  askAccept:()=>{ const e=S.editor; e.draft.instructions += (e.draft.instructions?"\n":"") + e.proposal; e.proposal=null; e.ask=""; },
  askDiscard:()=>{ S.editor.proposal=null; },
  saveRole:()=>{ saveRole(); },
  budget:d=>{ S.budget=d.b; toast(`Budget set to ${BUDGETS[d.b].name}. New assignments use the new effort levels.`); return false; },
  pbYes:()=>{ const t=ticket("t1"); t.playbook=S.modal.to; t.playbookBy="operator"; S.modal=null; S.drafts.steer=""; queueSteer(`Switch this run to the ${PLAYBOOKS.find(p=>p.id===t.playbook).name} playbook and replan at the next safe point.`); },
  newTicket:()=>{ S.modal={type:"newTicket",title:"",text:""}; S.navOpen=false; },
  createTicket:()=>{ const m=S.modal; const id=nid("t"); S.tickets.push({id,key:"LOCAL-0"+(194+seq%50),source:"Local",title:m.title.trim(),jira:"Not linked",workflow:"Refining",playbook:"feature",playbookBy:"coordinator",brief:{rev:1,text:m.text.trim()||"(no request text yet)",criteria:["(add acceptance criteria)"],repo:"choose a repository"}}); S.modal=null; S.view="session"; S.selected=id; toast("Ticket created. Shape its brief, then queue a run."); },
};

function sendSteer(){ const text=S.drafts.steer.trim(); if(!text) return; S.drafts.steer=""; queueSteer(text); }
function queueSteer(text){
  const m={id:nid("m"),text,stored:now(),received:null,applied:null}; S.run.steering.push(m);
  if (S.run.status==="running") deliver(m);
  else toast("Stored. It will be delivered when the run resumes.");
}
function deliver(m){ setTimeout(()=>{ if(S.run.status!=="running") return; m.received=now(); render(); setTimeout(()=>{ if(S.run.status!=="running") return; m.applied=now(); S.run.coord.lines.push("▸ steering applied: "+m.text.slice(0,60)+(m.text.length>60?"…":"")); render(); },2200); },1100); }
function deliverPending(){ S.run.steering.filter(m=>!m.received).forEach(deliver); }
function scheduleProposed(){
  S.run.agents.filter(a=>a.state==="proposed" && !a.timer).forEach(a=>{
    a.timer = setTimeout(function go(){ if (S.run.status!=="running"){ a.timer=setTimeout(go,1500); return; } if(!S.run.agents.includes(a)) return; a.state="executing"; a.last=now(); a.lines.push("— admitted at a safe coordination point —"); S.run.coord.lines.push(`▸ team: admitted ${role(a.roleId).name} (attempt 1)`); render(); toast(`${role(a.roleId).name} started. Its terminal is now live.`); }, 6000);
  });
}
function draftFrom(text, from){
  const t = text.toLowerCase(); const base = from ? role(from) : null;
  const words = text.replace(/^(someone|an? agent|a specialist)\s+(who|that)\s+/i,"").split(/\s+/);
  const topics = [["kafka","Kafka consumer reviewer","Engineering"],["secur","Security reviewer","Engineering"],["doc","Documentation reviewer","Delivery"],["perf","Performance analyst","Engineering"],["test","Test specialist","Quality"],["access","Accessibility reviewer","Product"],["migrat","Migration specialist","Engineering"],["api","API reviewer","Engineering"],["ux","UX reviewer","Product"]];
  const hit = topics.find(([k])=>t.includes(k));
  const name = hit ? hit[1] : (base ? base.name+" variant" : words.slice(0,3).map(w=>w[0]?.toUpperCase()+w.slice(1)).join(" ").replace(/[.,]$/,""));
  const job = /review|check|audit|verify/.test(t) ? "review" : /implement|write|fix|build|change/.test(t) ? "code" : "judgment";
  const principles = ["evidence"]; if (/bug|fail|break|regress/.test(t)) principles.push("root"); if (/test|check|verify|prove/.test(t)||job==="review") principles.push("prove"); if (job==="code") principles.push("units","subtract");
  const clause = text.trim().replace(/^(someone|an? agent|a specialist)\s+(who|that)\s+/i,"").replace(/\.$/,"");
  return {name, category: hit?hit[2]:(base?base.category:"Quality"), purpose:`Pick when the work needs someone who ${clause}.`,
    instructions: (base?base.instructions+"\n":"") + `${clause.charAt(0).toUpperCase()+clause.slice(1)}. Work only within the accepted brief and your assignment. Report each finding with the file, the revision checked and the evidence behind it.`,
    job, model:"", effort:"", principles:[...new Set(principles)], enabled:true};
}
function saveRole(){
  const e=S.editor, d=e.draft;
  if (e.id==="new"){
    let id=slug(d.name); while(role(id)) id+="-2";
    const r = mkRole(id,d.name.trim(),d.category,d.purpose,d.job,d.principles.slice(),d.instructions,{model:d.model,effort:d.effort,enabled:d.enabled,used:0});
    r.revisions[0].at="2026-10-04"; r.revisions[0].note = e.drafted.length?"Drafted from a description, reviewed by you":"Created in settings";
    S.roles.push(r); S.editor=null; toast(`Saved ${r.name} as revision 1. It is available for new assignments.`);
  } else {
    const r=role(e.id); Object.assign(r, JSON.parse(JSON.stringify(d))); r.revision++; r.revisions.push({rev:r.revision,at:"2026-10-04",note:"Edited in settings",instructions:r.instructions,purpose:r.purpose});
    S.editor=null; toast(`Saved ${r.name} revision ${r.revision}. Running assignments keep revision ${r.revision-1}.`);
  }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el){ if (S.menu){ S.menu=null; render(); } return; }
  if (el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.dataset.a!=="menu" && S.menu && !el.closest(".menu-pop")) S.menu=null;
  const res = fn(el.dataset, el, e);
  if (res !== false) render();
});
document.addEventListener("input", e => {
  const b = e.target.dataset.bind; if (!b) return;
  setPath(b, e.target.value);
  if (b.startsWith("editor.draft.")) { const f=b.split(".")[2]; S.editor.drafted = S.editor.drafted.filter(x=>x!==f); }
  if (["roleSearch","modal.q"].includes(b) || b.startsWith("editor") || b.startsWith("modal") || b==="drafts.steer") render();
});
document.addEventListener("change", e => {
  const c = e.target.dataset.change; if (!c) return; const v = e.target.value;
  if (c==="playbook"){ if (S.selected==="t1" && S.run.status!=="cancelled"){ if (v!==ticket("t1").playbook) S.modal={type:"playbook",to:v}; } else { ticket(S.selected).playbook=v; ticket(S.selected).playbookBy="operator"; toast("Playbook saved with the queued plan."); } }
  if (c==="roleFilter") S.roleFilter=v;
  if (c==="job"){ S.jobs[e.target.dataset.job]=v; toast(`${JOBS[e.target.dataset.job].name} job now uses ${v} for new assignments.`); }
  if (c==="edCategory"){ S.editor.draft.category=v; S.editor.drafted=S.editor.drafted.filter(x=>x!=="category"); }
  if (c==="edModel") S.editor.draft.model=v;
  if (c==="edEffort") S.editor.draft.effort=v;
  if (c==="previewTicket") S.editor.previewTicket=v;
  if (c==="dsFrom") S.modal.from=v;
  render();
});
document.addEventListener("keydown", e => {
  if (e.key==="Enter" && (e.metaKey||e.ctrlKey) && e.target.id==="steer-input"){ e.preventDefault(); sendSteer(); render(); }
  if (e.key==="Escape"){
    if (S.modal){ S.modal=null; } else if (S.editor){ if (dirty()) S.editor.confirmClose=true; else S.editor=null; } else if (S.maxAgent){ S.maxAgent=null; } else if (S.menu){ S.menu=null; } else if (S.navOpen){ S.navOpen=false; } else return;
    render();
  }
});

/* ---------- live simulation ---------- */
function emit(a){
  const script = SCRIPTS[a.roleId] || SCRIPTS.generic;
  const line = script[a.cursor % script.length]; a.cursor++;
  a.lines.push(line); if (a.lines.length>300) a.lines.shift();
  const ev = {t:now(),kind:kindOf(line),text:line,usage:Math.random()<.3?"actual · "+(1+Math.random()*5).toFixed(1)+"k tok":""};
  a.timeline.push(ev); if (a.timeline.length>300) a.timeline.shift();
  a.last = now();
  document.querySelectorAll(`[id="term-${a.id}"]`).forEach(term=>{ const atEnd = term.scrollHeight-term.clientHeight-term.scrollTop < 8; term.insertAdjacentHTML("beforeend", lineHtml(line)); if (atEnd) term.scrollTop = term.scrollHeight; });
  document.querySelectorAll(`[id="tl-${a.id}"]`).forEach(tl=>{ const atEnd = tl.scrollHeight-tl.clientHeight-tl.scrollTop < 8; tl.insertAdjacentHTML("beforeend", tlRow(ev)); if (atEnd) tl.scrollTop = tl.scrollHeight; });
}
setInterval(()=>{
  const r = S.run;
  if (r.status==="running"){
    r.activeS++;
    if (Math.random()<.35) emit(r.coord);
    r.agents.forEach(a=>{ if (a.state==="executing" && Math.random()<.5) emit(a); });
    const bar = document.querySelector(".timebar"); if (bar){ bar.firstChild.textContent = `Active ${Math.floor(r.activeS/60)}m ${String(r.activeS%60).padStart(2,"0")}s of 60m `; bar.querySelector(".meter i").style.width = Math.min(100,r.activeS/r.limitS*100)+"%"; }
  }
  document.querySelectorAll("[data-ago]").forEach(el=>{ const a=findAgent(el.dataset.ago); if(a) el.textContent=(a.state==="executing"?"active ":"last output ")+ago(a.last); });
}, 1000);

render();
</script>
